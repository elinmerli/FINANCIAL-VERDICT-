<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Verdict — Economic Analyzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090d16;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .brand {
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            color: #10b981;
            text-align: center;
            margin-bottom: 6px;
            font-weight: 700;
        }
        h1 { color: #ffffff; font-size: 28px; margin-bottom: 8px; text-align: center; font-weight: 800; }
        .subtitle { color: #9ca3af; font-size: 14px; text-align: center; margin-bottom: 32px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select {
            width: 100%;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus, select:focus { border-color: #10b981; background-color: #141b2d; }
        .btn {
            width: 100%;
            background-color: #10b981;
            color: #090d16;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover { background-color: #059669; transform: translateY(-1px); }
        .result-box {
            margin-top: 30px;
            padding: 24px;
            background-color: #141b2d;
            border: 1px solid #1f2937;
            border-radius: 14px;
            display: none;
        }
        .result-title { color: #ffffff; font-size: 18px; margin-bottom: 16px; font-weight: 700; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .result-val { font-weight: 700; color: #fff; }
        .verdict { margin-top: 16px; padding-top: 16px; border-top: 1px solid #1f2937; font-size: 14px; color: #9ca3af; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">Economic Analysis</div>
    <h1>FINANCIAL VERDICT</h1>
    <div class="subtitle">Calculate the real purchasing power of your future capital</div>

    <div class="input-group">
        <label>Target Capital</label>
        <input type="number" id="target" value="1000000" placeholder="Enter target amount">
    </div>

    <div class="input-group">
        <label>Time Horizon (Years)</label>
        <input type="number" id="years" value="5" placeholder="Enter number of years">
    </div>

    <div class="input-group">
        <label>Currency & Economic Zone</label>
        <select id="inflation">
            <option value="2.5">US Dollar (USD) — Inflation ~2.5%</option>
            <option value="2.0">Eurozone (EUR) — Inflation ~2.0%</option>
            <option value="4.5">Poland (PLN) — Inflation ~4.5%</option>
        </select>
    </div>

    <button class="btn" onclick="calculateVerdict()">Get Verdict</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">Calculation Results:</div>
        <div class="result-item">
            <span>Nominal Target:</span>
            <span class="result-val" id="resNominal">0</span>
        </div>
        <div class="result-item">
            <span>Real Purchasing Power:</span>
            <span class="result-val" id="resReal" style="color: #ef4444;">0</span>
        </div>
        <div class="result-item">
            <span>Required Monthly Savings:</span>
            <span class="result-val" id="resMonthly" style="color: #38bdf8;">0</span>
        </div>
        <div class="verdict" id="resVerdict"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
