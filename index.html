<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="The Monetary Archive — international financial and economic information."
    >

    <title>The Monetary Archive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>

    <script src="data.js" defer></script>
    <script src="globe.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-emblem">M</div>

            <div class="brand-text">
                <span class="brand-name">THE MONETARY</span>
                <span class="brand-subtitle">ARCHIVE</span>
            </div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="navigation-caption">MAIN ARCHIVE</div>

        <nav class="navigation" aria-label="Main navigation">

            <button class="nav-link active" data-page="overview">
                <span class="nav-icon">⌂</span>
                <span>Overview</span>
            </button>

            <button class="nav-link" data-page="globe">
                <span class="nav-icon">◎</span>
                <span>Global Globe</span>
            </button>

            <button class="nav-link" data-page="currencies">
                <span class="nav-icon">¤</span>
                <span>Currencies</span>
            </button>

            <button class="nav-link" data-page="markets">
                <span class="nav-icon">⌁</span>
                <span>Markets & Bitcoin</span>
            </button>

            <button class="nav-link" data-page="economy">
                <span class="nav-icon">▤</span>
                <span>Inflation & Economy</span>
            </button>

            <button class="nav-link" data-page="calculators">
                <span class="nav-icon">∑</span>
                <span>Calculators</span>
            </button>

            <button class="nav-link" data-page="history">
                <span class="nav-icon">◷</span>
                <span>Historical Archive</span>
            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="sidebar-divider"></div>

            <div class="sidebar-status">
                <span class="status-dot" id="status-dot"></span>

                <div>
                    <div class="status-title" id="connection-status">
                        CONNECTING
                    </div>

                    <div class="status-description">
                        External data sources
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                ESTABLISHED MMXXVI
            </div>

        </div>

    </aside>


    <main class="main-area">

        <header class="topbar">

            <div class="topbar-left">

                <div class="breadcrumb">
                    THE MONETARY ARCHIVE
                    <span>/</span>
                    <strong id="current-section-title">Overview</strong>
                </div>

                <div class="topbar-date" id="current-date"></div>

            </div>

            <div class="topbar-right">

                <div class="currency-selector">

                    <label for="display-currency">DISPLAY IN</label>

                    <select id="display-currency">
                        <option value="USD" selected>USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="CHF">CHF</option>
                        <option value="JPY">JPY</option>
                        <option value="PLN">PLN</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                        <option value="CNY">CNY</option>
                        <option value="INR">INR</option>
                        <option value="BRL">BRL</option>
                        <option value="SEK">SEK</option>
                        <option value="NOK">NOK</option>
                        <option value="DKK">DKK</option>
                        <option value="CZK">CZK</option>
                        <option value="HUF">HUF</option>
                    </select>

                </div>

                <button
                    class="refresh-button"
                    id="refresh-data"
                    title="Refresh data"
                    aria-label="Refresh data"
                >
                    ↻
                </button>

            </div>

        </header>


        <div class="content-wrapper">

            <div class="page-content" id="page-content">

                <div class="initial-loading">
                    <div class="loading-emblem">M</div>
                    <div>OPENING THE ARCHIVE</div>
                    <div class="loading-line"></div>
                </div>

            </div>

        </div>


        <footer class="main-footer">

            <span>THE MONETARY ARCHIVE</span>

            <span id="last-update">Awaiting data</span>

            <span>INFORMATIONAL FINANCIAL RECORDS</span>

        </footer>

    </main>

</div>

</body>
</html>
