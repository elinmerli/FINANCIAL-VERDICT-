
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#101110"
  >

  <meta
    name="description"
    content="The Monetary Archive — international financial data, currency markets, economic indicators and historical records."
  >

  <title>The Monetary Archive | International Financial Record</title>

  <!-- PRECONNECT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://api.frankfurter.dev">
  <link rel="preconnect" href="https://api.nbp.pl">
  <link rel="preconnect" href="https://api.coinpaprika.com">
  <link rel="preconnect" href="https://api.worldbank.org">

  <!-- TYPOGRAPHY -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CHARTS -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"
    defer
  ></script>

  <!-- WORLD MAP DATA -->
  <script
    src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"
    defer
  ></script>

  <!-- 3D GLOBE -->
  <script
    src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"
    defer
  ></script>

  <!-- SITE DATA ENGINE -->
  <script src="./data.js" defer></script>

  <!-- MAIN APPLICATION -->
  <script src="./app.js" defer></script>

  <style>
    :root {
      color-scheme: dark;

      --background: #101110;
      --sidebar: #141512;
      --surface: #191a17;
      --surface-raised: #20211d;

      --gold: #a58b59;
      --bronze: #756344;
      --cream: #e8e0cf;
      --muted: #9c978a;

      --border: #39372d;
      --green: #87977a;
      --red: #a36d67;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--cream);
      font-family: "DM Sans", sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 3px;
    }

    ::selection {
      background: var(--bronze);
      color: white;
    }

    #monetary-archive-app {
      min-height: 100vh;
      width: 100%;
    }

    #ma-shell {
      min-height: 100vh;
    }

    #ma-main {
      min-width: 0;
      overflow-x: hidden;
    }

    #ma-globe {
      width: 100%;
      min-height: 370px;
      overflow: hidden;
      position: relative;
      background: #101722;
    }

    #ma-globe canvas {
      display: block;
    }

    .ma-section,
    .ma-card {
      overflow: hidden;
    }

    .ma-table-wrap {
      width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--bronze) var(--surface);
    }

    .ma-table-wrap::-webkit-scrollbar {
      height: 6px;
    }

    .ma-table-wrap::-webkit-scrollbar-thumb {
      background: var(--bronze);
    }

    .ma-status {
      overflow-wrap: anywhere;
    }

    .ma-nav button {
      transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease;
    }

    .ma-card {
      transition: border-color .2s ease;
    }

    .ma-card:hover {
      border-color: var(--bronze);
    }

    @media (max-width: 900px) {
      #ma-shell {
        grid-template-columns: 190px minmax(0, 1fr);
      }
    }

    @media (max-width: 620px) {
      #ma-shell {
        display: block;
      }

      #ma-sidebar {
        min-height: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- APPLICATION ROOT -->
  <div id="monetary-archive-app">

    <noscript>
      <div style="
        padding: 40px;
        background: #101110;
        color: #e8e0cf;
        font-family: sans-serif;
      ">
        JavaScript must be enabled to use The Monetary Archive.
      </div>
    </noscript>

    <div style="
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101110;
      color: #a58b59;
      font-family: Georgia, serif;
      text-align: center;
      padding: 30px;
    ">
      <div>
        <div style="
          font-size: 34px;
          letter-spacing: 2px;
        ">
          THE MONETARY ARCHIVE
        </div>

        <div style="
          margin-top: 12px;
          font-family: sans-serif;
          font-size: 10px;
          letter-spacing: 3px;
          color: #9c978a;
        ">
          INITIALIZING FINANCIAL RECORDS
        </div>
      </div>
    </div>

  </div>

</body>
</html>
